<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misión Anatomía · Planos, ejes, movimientos y posiciones</title>
<meta name="description" content="App de estudio de Anatomía Aplicada (1.º Bachillerato): posición anatómica, planos, ejes, movimientos y posiciones del paciente.">
<style>
:root{
  --bg:#f4f1ea; --bg2:#fffdf8; --card:#ffffff; --ink:#1b1d2a; --mid:#555a6e; --soft:#8a8fa3; --line:#e2ddd2;
  --ori:#e2543c; --pla:#2f7fd8; --eje:#1aa37a; --pos:#8a4fd8; --gold:#e8a317;
  --ok:#178a55; --bad:#c23a2b; --okbg:#e3f5ec; --badbg:#fbe7e4;
  --bodyfill:#f3e3d3; --bodystroke:#3b3340; --plane:rgba(47,127,216,.28);
  --shadow:0 2px 0 rgba(27,29,42,.08),0 8px 24px rgba(27,29,42,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12131c; --bg2:#1a1c28; --card:#202334; --ink:#f1efe8; --mid:#b7b9c8; --soft:#8b8ea3; --line:#30344a;
  --okbg:#13352a; --badbg:#3d1d1a; --ok:#4fd39a; --bad:#ff7a6a;
  --bodyfill:#3a3346; --bodystroke:#e9dfd4; --plane:rgba(96,165,250,.32);
  --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#12131c; --bg2:#1a1c28; --card:#202334; --ink:#f1efe8; --mid:#b7b9c8; --soft:#8b8ea3; --line:#30344a;
  --okbg:#13352a; --badbg:#3d1d1a; --ok:#4fd39a; --bad:#ff7a6a;
  --bodyfill:#3a3346; --bodystroke:#e9dfd4; --plane:rgba(96,165,250,.32);
  --shadow:0 2px 0 rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:17px;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:16px}
.xpchip{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.xpbar{width:90px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f5c95a);width:0;transition:width .5s}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
h1{font-size:clamp(26px,6vw,38px);line-height:1.1;letter-spacing:-.03em;margin:22px 0 6px}
h2{font-size:22px;letter-spacing:-.02em;margin:22px 0 8px}
h3{font-size:17px;margin:16px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--mid)}
.small{font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:12px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.hero{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.count{text-align:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;min-width:96px}
.count b{display:block;font-size:30px;line-height:1}
.count span{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.mission{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;transition:transform .12s}
.mission:hover{transform:translateY(-2px)}
.mission .ic{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;color:#fff}
.mission .tt{font-weight:800;font-size:16.5px;line-height:1.2}
.mission .ds{font-size:13.5px;color:var(--mid)}
.mission .meter{display:block;height:6px;background:var(--line);border-radius:6px;margin-top:8px;overflow:hidden}
.mission .meter i{display:block;height:100%}
.medal{position:absolute;top:10px;right:12px;font-size:20px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--line);color:var(--ink)}
.tag.amp{background:transparent;border:1.5px dashed var(--soft);color:var(--mid)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--ink);color:var(--bg);min-height:46px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tool{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.tool b{display:block;font-size:15px}
.tool span{font-size:12.5px;color:var(--mid)}
.tool .e{font-size:22px}
.back{background:none;border:0;padding:8px 0;font-weight:700;color:var(--mid);cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.box.key{background:color-mix(in srgb,var(--gold) 16%,var(--card));border-left:5px solid var(--gold)}
.box.warn{background:var(--badbg);border-left:5px solid var(--bad)}
.box.amp{border:1.5px dashed var(--soft)}
.box.clin{background:color-mix(in srgb,var(--pos) 12%,var(--card));border-left:5px solid var(--pos)}
.box .lab{display:block;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mid)}
.tablewrap{overflow-x:auto}
svg{max-width:100%;height:auto;display:block}
.bf{fill:var(--bodyfill);stroke:var(--bodystroke);stroke-width:1.6}
.bl{stroke:var(--bodystroke);stroke-linecap:round;stroke-linejoin:round;fill:none}
.blf{stroke:var(--bodyfill);stroke-linecap:round;stroke-linejoin:round;fill:none}
.ink{stroke:var(--ink);fill:none;stroke-linecap:round;stroke-linejoin:round}
.inkf{fill:var(--ink)}
.txt{fill:var(--ink);font:700 12px system-ui,sans-serif}
.txts{fill:var(--mid);font:500 10.5px system-ui,sans-serif}
.bed{fill:var(--soft);opacity:.55}
.fig{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px}
input[type=range]{width:100%;accent-color:var(--pla);height:30px}
.readout{font-weight:800;font-size:17px;margin:6px 0 2px}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mid);font-weight:700}
.progress{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s}
.qtext{font-size:19px;font-weight:800;line-height:1.3;margin:6px 0 12px}
.opts{display:grid;gap:9px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:13px;padding:12px 14px;text-align:left;cursor:pointer;font-weight:600;min-height:50px;display:flex;align-items:center;gap:10px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:15px;animation:pop .25s ease}
.fb.ok{background:var(--okbg);border-left:5px solid var(--ok)}
.fb.bad{background:var(--badbg);border-left:5px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.combo{font-weight:800;color:var(--gold)}
.big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1}
.center{text-align:center}
.xpfloat{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--gold);color:#201600;font-weight:900;padding:6px 14px;border-radius:999px;z-index:50;animation:float 1s ease forwards;pointer-events:none}
@keyframes float{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}
/* flashcards */
.flip{perspective:1000px;cursor:pointer;min-height:220px}
.flip .in{position:relative;width:100%;min-height:220px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--card)}
.flip .b{transform:rotateY(180deg);background:var(--bg2)}
.flip .f b{font-size:22px;line-height:1.25}
.boxes{display:flex;gap:8px;justify-content:center;margin:10px 0}
.boxes span{font-size:12px;font-weight:800;border:1.5px solid var(--line);border-radius:10px;padding:4px 10px}
/* selectors for combo */
.sel{display:grid;gap:6px;margin:8px 0}
.sel .lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-weight:700;cursor:pointer;font-size:14.5px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}
.chip.bad{border-color:var(--bad);background:var(--badbg);color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.pcard{border:2px solid var(--line);background:var(--card);border-radius:13px;padding:8px;cursor:pointer;text-align:center;font-weight:700;font-size:13.5px}
.pcard svg{margin:0 auto 4px}
.pcard.ok{border-color:var(--ok);background:var(--okbg)}
.pcard.bad{border-color:var(--bad);background:var(--badbg)}
.pcard:disabled{cursor:default}
.legend-mod{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.myth{border:1px solid var(--line);border-radius:13px;background:var(--card);margin:9px 0;overflow:hidden}
.myth button{width:100%;text-align:left;background:none;border:0;padding:13px 14px;font-weight:700;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.myth .ans{padding:0 14px 13px 44px;display:none;color:var(--ink)}
.myth.open .ans{display:block}
.myth .x{flex:none;width:24px;height:24px;border-radius:7px;background:var(--badbg);color:var(--bad);display:grid;place-items:center;font-weight:900}
.footer{margin-top:34px;font-size:12.5px;color:var(--soft);text-align:center}
.confirm{display:none;margin-top:10px}
.confirm.on{display:block}
.levels{display:flex;flex-wrap:wrap;gap:6px}
.levels span{font-size:12px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700}
.levels span.on{background:var(--gold);border-color:var(--gold);color:#201600}
@media (max-width:440px){#lvlName{display:none}.brand span:last-child{font-size:15px}}
.brand,.xpchip{white-space:nowrap}
@media (max-width:520px){.hero{grid-template-columns:1fr}.count{justify-self:start}.qtext{font-size:17.5px}}
:focus-visible{outline:3px solid var(--pla);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
.leg{stroke:var(--soft);stroke-width:3;fill:none}
.head{fill:var(--card);stroke:var(--ink);stroke-width:2.2}
.topbed{fill:var(--line);stroke:var(--soft);stroke-width:1}
.backrest{stroke:var(--soft);stroke-width:7;opacity:.6}
.ptx{fill:var(--ink);font:800 10px system-ui,sans-serif}
.ink.soft{stroke:var(--soft)}
</style>
</head>

<script>
/* =========================================================
   DATOS · Todo el contenido está aquí, separado de la lógica.
   Fuentes de clase: presentación «Planos de movimiento y ejes»,
   Genially «Planos anatómicos», apuntes «Tema 1. Introducción»
   (1.9–1.11, Ana Molina) y ficha «Posiciones básicas del paciente»
   (IES Gil y Carrasco). Lo marcado amp:true es ampliación.
   ========================================================= */

const EXAM_DATE = '2026-11-18';

const MODS = {
  ori: { name: 'Orientación', full: 'Posición anatómica y términos de orientación', icon: '🧭', color: 'var(--ori)', desc: 'El «punto cero» y el vocabulario para decir dónde está cada cosa.' },
  pla: { name: 'Planos', full: 'Planos y secciones', icon: '🔪', color: 'var(--pla)', desc: 'Cómo «cortar» el cuerpo: sagital, frontal y transversal.' },
  eje: { name: 'Ejes y movimientos', full: 'Ejes y movimientos', icon: '🔄', color: 'var(--eje)', desc: 'Alrededor de qué línea gira cada movimiento.' },
  pos: { name: 'Posiciones', full: 'Posiciones del paciente', icon: '🛏️', color: 'var(--pos)', desc: 'Las 11 posturas de la cama y el quirófano.' }
};

const LEVELS = [
  { xp: 0, name: 'Estudiante' },
  { xp: 120, name: 'Interna' },
  { xp: 320, name: 'Residente' },
  { xp: 650, name: 'Especialista' },
  { xp: 1000, name: 'Jefa de servicio' }
];

/* ---------- POSICIONES (pictogramas) ---------- */
const POSITIONS = {
  supino: { name: 'Decúbito supino', group: 'básica', look: 'Boca arriba, brazos y piernas extendidos junto al cuerpo.', use: 'Exploración médica y postoperados.' },
  dorsal: { name: 'Decúbito dorsal', group: 'básica', look: 'Boca arriba con las rodillas flexionadas y los talones apoyados.', use: 'Relajar los músculos del abdomen.' },
  lateral: { name: 'Decúbito lateral', group: 'básica', look: 'De costado, espalda recta, pierna de abajo extendida y la de arriba flexionada.', use: 'Enemas, exploraciones, higiene, masajes.' },
  sims: { name: 'Posición de seguridad (Sims)', group: 'básica', look: 'Como la lateral pero girada hacia boca abajo (semiprona), pierna de arriba muy flexionada.', use: 'Pacientes inconscientes.' },
  prono: { name: 'Decúbito prono (ventral)', group: 'básica', look: 'Boca abajo, sobre el abdomen, cabeza girada a un lado.', use: 'Operados de la zona dorsal (espalda).' },
  fowler: { name: 'Fowler', group: 'básica', look: 'Semisentado, respaldo a 45°, rodillas algo flexionadas. Semi-Fowler 30°; Fowler alta 90°.', use: 'Problemas cardíacos o respiratorios; comer, leer.' },
  trend: { name: 'Trendelenburg', group: 'quirúrgica', look: 'Boca arriba en camilla inclinada (45° según la ficha) con la cabeza más baja que los pies.', use: 'Cirugía de la zona pélvica, lipotimias (desmayos).' },
  anti: { name: 'Antitrendelenburg (Morestin)', group: 'quirúrgica', look: 'Igual pero al revés: la cabeza más alta que los pies.', use: 'Problemas respiratorios, hernia de hiato.' },
  roser: { name: 'Roser (Proetz)', group: 'quirúrgica', look: 'Boca arriba, hombros en el borde de la camilla y la cabeza colgando hacia atrás.', use: 'Otorrino, ojos, neurocirugía, intubación, lavar el pelo en cama.' },
  lito: { name: 'Ginecológica (litotomía)', group: 'quirúrgica', look: 'Boca arriba, pelvis en el borde de la mesa, piernas flexionadas, separadas y apoyadas en perneras.', use: 'Exploración ginecológica, partos, sondaje vesical.' },
  genu: { name: 'Genupectoral', group: 'quirúrgica', look: 'De rodillas, tronco inclinado, pecho y cabeza apoyados sobre los brazos.', use: 'Exploraciones rectales, enemas.' }
};

/* ---------- GESTOS para el reto «Plano + eje» ---------- */
const GESTURES = [

/* ---- PLANOS ---- */
function learnPla() {
  const html = `
  <p class="muted">Un <b>plano</b> es una superficie imaginaria que divide el cuerpo o un órgano. Lo que queda a la vista al cortar es la <b>sección</b>. Los tres planos principales son perpendiculares entre sí.</p>
  <h2>Laboratorio de cortes</h2>
  <p class="small muted">Elige un plano y mueve el deslizador. A la izquierda, de frente; a la derecha, de perfil (mira hacia la derecha).</p>
  <div class="tabs" role="group" aria-label="Elegir plano" id="plTabs">
    <button data-p="sag" aria-pressed="true">Sagital</button>
    <button data-p="fro" aria-pressed="false">Frontal (coronal)</button>
    <button data-p="tra" aria-pressed="false">Transversal</button>
  </div>
  <div class="fig" style="margin-top:8px">
    <svg viewBox="0 0 380 360" id="plSvg" role="img" aria-label="Cuerpo con un plano de corte">
      <use href="#body" x="10" y="10" width="200" height="340"/>
      <use href="#side" x="250" y="10" width="120" height="340"/>
      <g id="plLayer"></g>
    </svg>
    <input type="range" id="plRange" aria-label="Mover el plano">
    <div class="readout" id="plRead"></div>
    <p class="small muted" id="plSub"></p>
  </div>
  <div class="tablewrap"><table>
    <tr><th>Plano</th><th>Divide en</th><th>Cómo reconocerlo</th></tr>
    <tr><td><b>Sagital</b></td><td>Derecha e izquierda</td><td>Vertical, de delante atrás. Si pasa justo por la línea media es el <b>sagital medio</b> (mediano): <b>dos mitades iguales</b>. Si no, partes desiguales (parasagital).</td></tr>
    <tr><td><b>Frontal o coronal</b></td><td>Anterior (ventral) y posterior (dorsal)</td><td>Vertical, de lado a lado, paralelo a la frente. Sigue la sutura coronal del cráneo.</td></tr>
    <tr><td><b>Transversal u horizontal</b></td><td>Superior (craneal) e inferior (caudal)</td><td>Paralelo al suelo. En radiología se llama <b>axial</b> (el corte del TAC).</td></tr>
    <tr><td><b>Oblicuo</b></td><td>—</td><td>Corte inclinado que combina dos planos.</td></tr>
  </table></div>
  <div class="box key"><span class="lab">El truco del pan (del Genially)</span>Abrir un bollo en tapa y base: <b>transversal</b>. Partirlo a lo largo en dos mitades iguales: <b>sagital medio</b>. Separar la cara de delante de la de detrás: <b>frontal</b>.</div>
  <div class="box warn"><span class="lab">Trampa</span>Se corta por un <b>plano</b> (una superficie), no por un eje. Si una pregunta dice «¿por qué eje hemos cortado?», responde con el plano.</div>`;
  return { html, init() {
    let mode = 'sag';
    const r = $('#plRange'), layer = $('#plLayer');
    const cfg = {
      sag: { min: -45, max: 45, val: 18 },
      fro: { min: -26, max: 26, val: 0 },
      tra: { min: 40, max: 320, val: 150 }
    };
    function draw() {
      const v = +r.value;
      let g = '', read = '', sub = '';
      if (mode === 'sag') {
        const x = 110 + v;
        g = `<polygon points="${x - 9},6 ${x + 9},-4 ${x + 9},344 ${x - 9},354" fill="url(#hatch)" opacity=".85" stroke="var(--pla)" stroke-width="2"/>
             <rect x="250" y="8" width="120" height="344" rx="10" fill="var(--plane)" stroke="var(--pla)" stroke-width="2"/>
             <text class="txts" x="254" y="24">aquí el plano</text><text class="txts" x="254" y="37">es la pantalla</text>`;
        const medio = Math.abs(v) <= 3;
        read = medio ? '✔ Plano sagital MEDIO: dos mitades iguales' : 'Plano sagital (parasagital): mitades desiguales';
        sub = medio ? 'Separa la mitad derecha de la izquierda, y ambas miden lo mismo. Prueba a moverlo.' : 'Sigue separando derecha de izquierda, pero no por la línea media. Lleva el deslizador al centro.';
      } else if (mode === 'fro') {
        const x = 308 + v;
        g = `<rect x="10" y="8" width="200" height="344" rx="10" fill="var(--plane)" stroke="var(--pla)" stroke-width="2"/>
             <polygon points="${x - 8},4 ${x + 8},-6 ${x + 8},344 ${x - 8},354" fill="url(#hatch)" opacity=".85" stroke="var(--pla)" stroke-width="2"/>
             <text class="txt" x="${x + 12}" y="180">delante</text><text class="txt" x="${x - 66}" y="180">detrás</text>`;
        read = 'Plano frontal (coronal): anterior | posterior';
        sub = 'De frente lo ves como la propia pantalla; de perfil, como una línea vertical. Separa la parte anterior (ventral) de la posterior (dorsal).';
      } else {
        const y = v;
        g = `<polygon points="0,${y + 10} 210,${y - 8} 230,${y + 8} 20,${y + 26}" fill="url(#hatch)" opacity=".85" stroke="var(--pla)" stroke-width="2"/>
             <polygon points="240,${y + 6} 375,${y - 4} 380,${y + 6} 245,${y + 16}" fill="url(#hatch)" opacity=".85" stroke="var(--pla)" stroke-width="2"/>`;
        const zona = y < 60 ? 'la cabeza' : y < 110 ? 'el cuello y los hombros' : y < 190 ? 'el tronco' : 'las piernas';
        read = 'Plano transversal (horizontal): superior | inferior';
        sub = `Ahora corta por ${zona}. Separa la parte superior (craneal) de la inferior (caudal). En radiología: corte axial.`;
      }
      layer.innerHTML = g; $('#plRead').textContent = read; $('#plSub').textContent = sub;
    }
    function setMode(m) {
      mode = m; const c = cfg[m]; r.min = c.min; r.max = c.max; r.value = c.val; draw();
      document.querySelectorAll('#plTabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === m));
    }
    r.addEventListener('input', draw);
    $('#plTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.p); });
    setMode('sag');
  } };
}

/* ---- POSICIONES ---- */
function learnPos() {
  const card = k => `<div class="card" style="margin:0"><div class="fig" style="padding:4px">${picto(k)}</div>
     <h3 style="margin:8px 0 2px">${POSITIONS[k].name} <span class="tag">${POSITIONS[k].group}</span></h3>
     <p class="small" style="margin:0 0 4px">${POSITIONS[k].look}</p><p class="small muted" style="margin:0"><b>Para qué:</b> ${POSITIONS[k].use}</p></div>`;
  const keys = Object.keys(POSITIONS);
  const html = `
  <p class="muted">Son las posturas en que se coloca a una persona en la cama o la camilla. Las <b>básicas</b> son para pacientes encamados con poca movilidad: cambiar de posición evita las <b>úlceras por presión (UPP)</b>. Las <b>quirúrgicas</b>, para operaciones y exploraciones.</p>
  <div class="box key"><span class="lab">Cómo reconocerlas</span>1) ¿Boca arriba, boca abajo o de lado? · 2) ¿La cama está plana, con el respaldo levantado o inclinada entera? · 3) ¿Qué hacen las piernas y la cabeza?</div>
  <div class="tabs" role="group" aria-label="Filtrar posiciones" id="psTabs">
    <button data-f="all" aria-pressed="true">Todas</button><button data-f="básica" aria-pressed="false">Básicas</button><button data-f="quirúrgica" aria-pressed="false">Quirúrgicas</button>
  </div>
  <div class="grid2" id="psGrid" style="margin-top:10px"></div>
  <div class="box warn"><span class="lab">Trampas</span><b>Supino</b> y <b>dorsal</b> son boca arriba; el dorsal lleva las rodillas flexionadas. <b>Trendelenburg</b>: cabeza abajo; <b>Anti</b>: cabeza arriba. En <b>Fowler</b> solo se levanta el respaldo; en Antitrendelenburg se inclina toda la camilla.</div>
  <div class="box clin"><span class="lab">En la práctica clínica</span>Al paciente inconsciente se le pone en posición de seguridad para que, si vomita, el contenido salga por la boca y no pase a la vía respiratoria. El Fowler facilita respirar porque las vísceras bajan y el diafragma se mueve mejor.</div>
  <div class="box amp"><span class="lab">Ampliación</span>La ficha da 45° para Trendelenburg; en el hospital suelen usarse inclinaciones menores (15–30°). Para el examen, usa el dato de clase. <b>Genu</b> = rodilla y <b>pectoral</b> = pecho; <b>litotomía</b> viene de la antigua operación para sacar «piedras» (<i>lithos</i>) de la vejiga.</div>`;
  return { html, init() {
    const set = f => {
      $('#psGrid').innerHTML = keys.filter(k => f === 'all' || POSITIONS[k].group === f).map(card).join('');
      document.querySelectorAll('#psTabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === f));
    };
    $('#psTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) set(b.dataset.f); });
    set('all');
  } };
}

/* =========================================================
   MOTOR DE PREGUNTAS
   ========================================================= */
function runQuiz(list, opts) {
  // opts: {title, mod, exam:boolean}
  let i = 0, score = 0, streak = 0, answers = [];
  const items = list.map(q => { const order = shuffle(q.o.map((t, idx) => idx)); return Object.assign({}, q, { order }); });
  function render() {
    const q = items[i];
    const letters = 'ABCD';
    app.innerHTML = `${back()}
      <div class="qhead"><span>${opts.title}</span><span>${i + 1} / ${items.length}${!opts.exam && streak >= 2 ? ` · <span class="combo">🔥 racha ${streak}</span>` : ''}</span></div>
      <div class="progress"><i style="width:${i / items.length * 100}%"></i></div>
      <div class="card">
        ${q.fig ? `<div class="fig" style="max-width:360px;margin:0 auto 8px">${picto(q.fig)}</div>` : ''}
        <div class="qtext">${q.q}</div>
        <div class="opts" role="group" aria-label="Opciones">${q.order.map((oi, n) => `<button class="opt" data-oi="${oi}"><span class="k">${letters[n]}</span><span>${esc(q.o[oi])}</span></button>`).join('')}</div>
        <div id="fbx" aria-live="polite"></div>
      </div>`;
    app.querySelector('.opts').addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || b.disabled) return;
      const oi = +b.dataset.oi, ok = oi === q.a;
      answers.push({ q, oi, ok });
      app.querySelectorAll('.opt').forEach(x => x.disabled = true);
      if (ok) score++;
      if (opts.exam) { b.style.borderColor = 'var(--ink)'; setTimeout(next, 250); return; }
      b.classList.add(ok ? 'ok' : 'bad');
      if (!ok) app.querySelector(`.opt[data-oi="${q.a}"]`).classList.add('ok');
      if (ok) { streak++; addXP(streak >= 3 ? 15 : 10, streak >= 3 ? 'racha' : ''); } else streak = 0;
      if (streak > (S.streakBest || 0)) { S.streakBest = streak; save(); }
      $('#fbx').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}"><b>${ok ? '✔ ¡Correcto!' : '✘ No es esa'}</b>${q.e}</div>
        <button class="btn wide" id="nx">${i + 1 < items.length ? 'Siguiente ▸' : 'Ver resultado ▸'}</button>`;
      $('#nx').focus();
      $('#nx').addEventListener('click', next);
    });
  }
  function next() { i++; if (i < items.length) render(); else finish(); }
  function finish() {
    const pct = Math.round(score / items.length * 100);
    let medalMsg = '';
    if (opts.mod) {
      const prev = S.best[opts.mod] || 0;
      if (pct > prev) S.best[opts.mod] = pct;
      if (pct >= 80 && prev < 80) { medalMsg = `<p class="big">🏅</p><p><b>¡Medalla de ${MODS[opts.mod].name}!</b></p>`; addXP(50, 'medalla'); }
      save();
    }
    if (opts.exam) { const k = 'sim'; if (pct > (S.best[k] || 0)) { S.best[k] = pct; } save(); addXP(score * 5, 'simulacro'); }
    const nota = (score / items.length * 10).toFixed(1).replace('.', ',');
    const fails = answers.filter(a => !a.ok);
    app.innerHTML = `${back()}
      <div class="card center">
        <p class="muted small">${opts.title}</p>
        <p class="big">${score} / ${items.length}</p>
        <p>${opts.exam ? `Nota estimada: <b>${nota}</b>` : `${pct}% de aciertos`}</p>
        ${medalMsg}
        <p class="muted small">${pct >= 90 ? 'Dominio total. ¡Así se hace!' : pct >= 80 ? 'Muy bien: lo tienes.' : pct >= 60 ? 'Vas bien. Repasa los fallos y repite.' : 'Toca repasar la teoría de esta misión y volver a intentarlo.'}</p>
        <div class="row" style="justify-content:center">
          <button class="btn" id="again">Repetir</button>
          ${opts.mod ? `<button class="btn ghost" data-go="learn" data-arg="${opts.mod}">Repasar teoría</button>` : ''}
          <button class="btn ghost" data-go="home">Mapa</button>
        </div>
      </div>
      ${fails.length ? `<h2>Repasa tus fallos</h2>${fails.map(a => `<div class="card"><b>${a.q.q}</b>${a.q.fig ? `<div style="max-width:260px">${picto(a.q.fig)}</div>` : ''}
        <p class="small" style="margin:6px 0 2px">Tu respuesta: <span style="color:var(--bad)">✘ ${esc(a.q.o[a.oi])}</span></p>
        <p class="small" style="margin:0 0 4px">Correcta: <span style="color:var(--ok)">✔ ${esc(a.q.o[a.q.a])}</span></p>
        <p class="small muted" style="margin:0">${a.q.e}</p></div>`).join('')}` : ''}`;
    $('#again').addEventListener('click', () => opts.again());
  }
  render();
}

function quizMod(k) {
  const pool = QUESTIONS.filter(q => q.m === k);
  const start = () => runQuiz(shuffle(pool).slice(0, 10), { title: 'Reto · ' + MODS[k].name, mod: k, again: start });
  start();
}
function sim() {
  const start = () => {
    // 5 por bloque, mezcladas
    const pick = Object.keys(MODS).flatMap(k => shuffle(QUESTIONS.filter(q => q.m === k)).slice(0, 5));
    app.innerHTML = `${back()}<h1>Simulacro de examen</h1>
      <div class="card"><p>20 preguntas mezcladas de los cuatro bloques. <b>No verás si aciertas hasta el final</b>, como en un examen real.</p>
      <p class="muted small">Tómatelo en serio: sin apuntes y sin prisa (unos 15 minutos).</p>
      <button class="btn wide" id="go">Empezar el simulacro ▸</button></div>`;
    $('#go').addEventListener('click', () => runQuiz(shuffle(pick), { title: 'Simulacro', exam: true, again: start }));
  };
  start();
}

/* =========================================================
   RETO PLANO + EJE
   ========================================================= */
function combo() {
  const round = shuffle(GESTURES).slice(0, 8);
  let i = 0, pts = 0;
  const PL = ['Sagital', 'Frontal', 'Transversal'], EJ = ['Transversal', 'Sagital', 'Longitudinal'], MV = ['Flexión / extensión', 'Abducción / aducción', 'Rotación'];
  function render() {
    const g = round[i]; const pick = { p: null, e: null, m: null };
    const chips = (key, arr, lbl) => `<div class="sel"><span class="lbl">${lbl}</span><div class="chips" data-k="${key}">${arr.map(v => `<button class="chip" aria-pressed="false" data-v="${v}">${v}</button>`).join('')}</div></div>`;
    app.innerHTML = `${back()}
      <div class="qhead"><span>🎯 Reto Plano + eje</span><span>${i + 1} / ${round.length} · ${pts} aciertos</span></div>
      <div class="progress"><i style="width:${i / round.length * 100}%"></i></div>
      <div class="card"><p class="muted small" style="margin:0">Descompón el gesto:</p><div class="qtext">${g.g}</div>
      ${chips('p', PL, 'Plano')}${chips('e', EJ, 'Eje')}${chips('m', MV, 'Movimiento')}
      <button class="btn wide" id="chk" disabled>Comprobar</button><div id="fbx" aria-live="polite"></div></div>`;
    app.querySelectorAll('.chips').forEach(box => box.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b || box.dataset.locked) return;
      box.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
      pick[box.dataset.k] = b.dataset.v;
      $('#chk').disabled = !(pick.p && pick.e && pick.m);
    }));
    $('#chk').addEventListener('click', () => {
      const right = { p: g.p, e: g.e, m: g.m }; let all = true;
      app.querySelectorAll('.chips').forEach(box => {
        box.dataset.locked = 1; const k = box.dataset.k;
        box.querySelectorAll('.chip').forEach(c => {
          if (c.dataset.v === right[k]) c.classList.add('ok');
          else if (c.getAttribute('aria-pressed') === 'true') { c.classList.add('bad'); all = false; }
          c.setAttribute('aria-pressed', 'false');
        });
      });
      if (all) { pts++; addXP(15, 'combo'); }
      $('#chk').remove();
      $('#fbx').innerHTML = `<div class="fb ${all ? 'ok' : 'bad'}"><b>${all ? '✔ ¡Combo perfecto!' : '✘ Revisa lo marcado en rojo'}</b>${g.why}<br><span class="small">Respuesta: plano ${g.p.toLowerCase()} · eje ${g.e.toLowerCase()} · ${g.m.toLowerCase()}.</span></div>
        <button class="btn wide" id="nx">${i + 1 < round.length ? 'Siguiente gesto ▸' : 'Ver resultado ▸'}</button>`;
      $('#nx').addEventListener('click', () => { i++; i < round.length ? render() : end(); });
    });
  }
  function end() {
    app.innerHTML = `${back()}<div class="card center"><p class="muted small">Reto Plano + eje</p><p class="big">${pts} / ${round.length}</p>
      <p>${pts === round.length ? '¡Perfecto! Plano y eje dominados.' : 'Recuerda: sagital–transversal–flexión · frontal–sagital–abducción · transversal–longitudinal–rotación.'}</p>
      <div class="row" style="justify-content:center"><button class="btn" data-go="combo">Otra ronda</button><button class="btn ghost" data-go="learn" data-arg="eje">Ver el simulador</button></div></div>`;
  }
  render();
}

/* =========================================================
   RETO QUIRÓFANO
   ========================================================= */
function quiro() {
  const round = shuffle(TECHS).slice(0, 10);
  let i = 0, pts = 0;
  const keys = Object.keys(POSITIONS);
  function render() {
    const t = round[i];
    app.innerHTML = `${back()}
      <div class="qhead"><span>🏥 Quirófano</span><span>${i + 1} / ${round.length} · ${pts} aciertos</span></div>
      <div class="progress"><i style="width:${i / round.length * 100}%"></i></div>
      <div class="card"><p class="muted small" style="margin:0">¿Qué posición emplearías?</p><div class="qtext">${t.t}</div>
      <div class="pgrid">${shuffle(keys).map(k => `<button class="pcard" data-k="${k}">${picto(k, 150)}${POSITIONS[k].name}</button>`).join('')}</div>
      <div id="fbx" aria-live="polite"></div></div>`;
    app.querySelector('.pgrid').addEventListener('click', e => {
      const b = e.target.closest('.pcard'); if (!b || b.disabled) return;
      const ok = t.a.includes(b.dataset.k);
      app.querySelectorAll('.pcard').forEach(c => { c.disabled = true; if (t.a.includes(c.dataset.k)) c.classList.add('ok'); });
      if (!ok) b.classList.add('bad');
      if (ok) { pts++; addXP(10); }
      $('#fbx').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}"><b>${ok ? '✔ ¡Bien elegido!' : '✘ No es la mejor opción'}</b>${t.why}${t.a.length > 1 ? '<br><span class="small">Aquí vale más de una respuesta si la justificas.</span>' : ''}</div>
        <button class="btn wide" id="nx">${i + 1 < round.length ? 'Siguiente paciente ▸' : 'Ver resultado ▸'}</button>`;
      $('#nx').scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('#nx').addEventListener('click', () => { i++; i < round.length ? render() : end(); });
    });
  }
  function end() {
    app.innerHTML = `${back()}<div class="card center"><p class="muted small">Quirófano</p><p class="big">${pts} / ${round.length}</p>
      <p>${pts >= 8 ? '¡Equipo médico de primera!' : 'Repasa la galería de posiciones y vuelve a intentarlo.'}</p>
      <div class="row" style="justify-content:center"><button class="btn" data-go="quiro">Nuevos pacientes</button><button class="btn ghost" data-go="learn" data-arg="pos">Ver la galería</button></div></div>`;
  }
  render();
}

/* =========================================================
   TARJETAS (Leitner, 3 cajas)
   ========================================================= */
function cards(filter) {
  const f = filter || 'all';
  const pool = CARDS.map((c, idx) => Object.assign({ id: 'c' + idx }, c)).filter(c => f === 'all' || c.m === f);
  const box = c => S.leit[c.id] || 1;
  function pickNext() {
    for (const b of [1, 2, 3]) { const inBox = pool.filter(c => box(c) === b); if (inBox.length) return { c: shuffle(inBox)[0], b }; }
    return null;
  }
  function render() {
    const counts = [1, 2, 3].map(b => pool.filter(c => box(c) === b).length);
    const nx = pickNext(); if (!nx) return;
    const c = nx.c;
    app.innerHTML = `${back()}<h1>🃏 Tarjetas</h1>
      <div class="tabs" role="group" aria-label="Filtrar tarjetas" id="cfTabs">
        <button data-f="all" aria-pressed="${f === 'all'}">Todas</button>${Object.keys(MODS).map(k => `<button data-f="${k}" aria-pressed="${f === k}">${MODS[k].name}</button>`).join('')}
      </div>
      <div class="boxes" aria-label="Cajas de repaso"><span>Caja 1 · ${counts[0]}</span><span>Caja 2 · ${counts[1]}</span><span>Caja 3 · ${counts[2]}</span></div>
      <p class="small muted center">Primero salen las de la caja 1 (las que menos sabes). Piensa la respuesta antes de girar.</p>
      <div class="flip" id="fc" tabindex="0" role="button" aria-label="Girar tarjeta"><div class="in">
        <div class="f"><span class="tag" style="background:${MODS[c.m].color};color:#fff">${MODS[c.m].name}</span><b style="margin-top:10px">${c.f}</b><span class="small muted" style="margin-top:12px">Toca para girar</span></div>
        <div class="b"><p style="font-size:18px">${c.b}</p></div></div></div>
      <div class="row" style="margin-top:12px;justify-content:center" id="fcBtns" hidden>
        <button class="btn ghost" id="no">🔁 Repasar</button><button class="btn" id="si">✔ Lo sabía</button></div>`;
    const fc = $('#fc');
    const flip = () => { fc.classList.toggle('on'); $('#fcBtns').hidden = false; };
    fc.addEventListener('click', flip);
    fc.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    $('#si').addEventListener('click', () => { S.leit[c.id] = Math.min(3, box(c) + 1); save(); addXP(3); render(); });
    $('#no').addEventListener('click', () => { S.leit[c.id] = 1; save(); render(); });
    $('#cfTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go('cards', b.dataset.f); });
  }
  render();
}

/* =========================================================
   TRAMPAS
   ========================================================= */
function myths() {
  app.innerHTML = `${back()}<h1>⚠️ Trampas del examen</h1>
    <p class="muted">Cada frase es <b>falsa</b>. Antes de abrirla, intenta decir por qué. Luego compruébalo.</p>
    ${MYTHS.map((m, i) => `<div class="myth" id="m${i}"><button aria-expanded="false" aria-controls="ma${i}"><span class="x">✘</span><span>${m.x}</span></button><div class="ans" id="ma${i}">${m.v}</div></div>`).join('')}`;
  app.querySelectorAll('.myth button').forEach(b => b.addEventListener('click', () => {
    const d = b.parentElement; const on = !d.classList.contains('open'); d.classList.toggle('open', on); b.setAttribute('aria-expanded', on);
    if (on && !S.done[d.id]) { S.done[d.id] = 1; save(); addXP(2); }
  }));
}

/* =========================================================
   PROGRESO
   ========================================================= */
function progress() {
  const { l, n } = level();
  const known = Object.values(S.leit).filter(v => v === 3).length;
  app.innerHTML = `${back()}<h1>📈 Mi progreso</h1>
    <div class="card"><p class="big">${S.xp} XP</p><p>Nivel actual: <b>${l.name}</b>${n ? ` · faltan ${n.xp - S.xp} XP para <b>${n.name}</b>` : ' · ¡nivel máximo!'}</p>
      <div class="levels">${LEVELS.map(x => `<span class="${S.xp >= x.xp ? 'on' : ''}">${x.name}</span>`).join('')}</div></div>
    <div class="card"><h3 style="margin-top:0">Medallas</h3>
      ${Object.keys(MODS).map(k => `<p style="margin:6px 0">${(S.best[k] || 0) >= 80 ? '🏅' : '⬜'} <b>${MODS[k].full}</b> · mejor: ${S.best[k] || 0}%</p>`).join('')}
      <p style="margin:6px 0">📝 <b>Simulacro</b> · mejor: ${S.best.sim || 0}%</p>
      <p style="margin:6px 0">🔥 <b>Mejor racha</b>: ${S.streakBest || 0} seguidas</p>
      <p style="margin:6px 0">🃏 <b>Tarjetas en la caja 3</b>: ${known} de ${CARDS.length}</p></div>
    <div class="card"><h3 style="margin-top:0">Empezar de cero</h3><p class="small muted">Borra XP, medallas y tarjetas de este navegador.</p>
      <button class="btn ghost" id="rst">Borrar mi progreso</button>
      <div class="confirm" id="cf"><p><b>¿Seguro?</b> No se puede deshacer.</p><div class="row"><button class="btn" id="yes" style="background:var(--bad)">Sí, borrar</button><button class="btn ghost" id="nop">Cancelar</button></div></div></div>`;
  $('#rst').addEventListener('click', () => $('#cf').classList.add('on'));
  $('#nop').addEventListener('click', () => $('#cf').classList.remove('on'));
  $('#yes').addEventListener('click', () => { const th = S.theme; S = Object.assign({}, DEF, { best: {}, leit: {}, done: {}, theme: th }); save(); renderXP(); go('home'); });
}

/* ---------- arranque ---------- */
renderXP();
go('home');
})();

</script>
